<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dce6ec">
<meta name="description" content="Neniの小天地：N9 與 N21 的整合入口。">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Neniの小天地</title>
<!-- 整合網站統一採用白色雛菊 SVG 網頁圖示 -->
<link rel="icon" type="image/svg+xml" href="./daisy.svg?v=neni-20261106-2">
<style>
  :root {
    color-scheme: light;
    --bar-height: 62px;
    --ink: #536777;
    --muted: #8193a0;
    --line: rgba(115, 139, 154, .22);
    --bar: rgba(247, 250, 251, .96);
    --active: #7895a8;
    --active-ink: #fff;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: #e9eff2;
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .topbar {
    position: relative;
    z-index: 5;
    flex: 0 0 var(--bar-height);
    height: var(--bar-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 0 18px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 3px 14px rgba(73, 96, 111, .08);
    backdrop-filter: blur(12px);
  }
  .brand {
    display: inline-flex; align-items: center; gap: 6px;
    flex: 0 0 auto;
    position: relative; z-index: 2;
    color: #607b8d;
    font-family: "Noto Serif TC", "Noto Sans TC", serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    white-space: nowrap;
    user-select: none;
  }
  .brand-icon { width: 22px; height: 22px; flex: none; }
  .tabs {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 0;
  }
  .open-original {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    margin-left: auto; padding: 8px 14px; border: 1px solid var(--line);
    border-radius: 999px; color: #597487; text-decoration: none;
    font-size: 13px; font-weight: 700; background: rgba(255,255,255,.72);
    white-space: nowrap; position: relative; z-index: 2;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .open-original:hover { background: #fff; box-shadow: 0 2px 8px rgba(73,96,111,.12); }
  .open-original:focus-visible { outline: 3px solid rgba(120,149,168,.5); outline-offset: 2px; }
  .tab {
    appearance: none;
    border: 1px solid rgba(120, 149, 168, .28);
    border-radius: 999px;
    padding: 8px 17px;
    min-height: 38px;
    background: rgba(225, 234, 239, .65);
    color: #647e8e;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab[aria-selected="true"] {
    color: var(--active-ink);
    background: var(--active);
    border-color: var(--active);
    box-shadow: 0 3px 9px rgba(89, 119, 139, .2);
  }
  .tab:focus-visible { outline: 3px solid rgba(120, 149, 168, .35); outline-offset: 2px; }
  main {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background: #edf2f4;
  }
  .site-frame {
    display: none;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
  .site-frame.is-active { display: block; }
  @media (max-width: 900px) {
    :root { --bar-height: 100px; }
    .topbar { display: grid; grid-template-columns: 1fr auto; grid-template-rows: 40px 46px; column-gap: 8px; row-gap: 0; padding: 6px 12px 8px; }
    .brand { grid-column: 1; grid-row: 1; justify-self: start; }
    .open-original { grid-column: 2; grid-row: 1; justify-self: end; margin: 0; }
    .tabs { position: static; transform: none; grid-column: 1 / -1; grid-row: 2; justify-self: center; }
  }
  @media (max-width: 520px) {
    .topbar { padding-inline: 9px; }
    .brand { font-size: 14px; letter-spacing: 0; }
    .tabs { gap: 7px; }
    .tab { min-height: 36px; padding: 7px 14px; font-size: 12px; }
    .open-original { font-size: 12px; padding: 7px 10px; }
  }
  @media (max-width: 360px) {
    .brand { font-size: 13px; }
    .tab { padding-inline: 10px; font-size: 11px; }
    .open-original { font-size: 11px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="Neniの小天地"><img class="brand-icon" src="./daisy.svg?v=neni-20261106-2" alt="" aria-hidden="true"> Neniの小天地</div>
  <nav class="tabs" role="tablist" aria-label="切換網站功能">
    <button class="tab" id="tab-songs" type="button" role="tab" aria-controls="page-songs" aria-selected="true" data-page="songs">♫ Neniの歌單</button>
    <button class="tab" id="tab-money" type="button" role="tab" aria-controls="page-money" aria-selected="false" tabindex="-1" data-page="money">❀ Neniの存鑽存歌</button>
  </nav>
  <a class="open-original" id="openOriginal" href="https://lionliontomato.github.io/N9/" target="_blank" rel="noopener noreferrer" aria-label="在原網站開啟 Neniの歌單">在原網站開啟 <span aria-hidden="true">↗</span></a>
</header>

<main>
  <iframe
    class="site-frame is-active"
    id="page-songs"
    title="N9｜Neniの歌單"
    src="https://lionliontomato.github.io/N9/"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <iframe
    class="site-frame"
    id="page-money"
    title="N21｜Neniの存鑽存歌"
    data-src="https://lionliontomato.github.io/N21/"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</main>

<script>
  (() => {
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const pages = {
      songs: document.getElementById('page-songs'),
      money: document.getElementById('page-money')
    };
    const originalLink = document.getElementById('openOriginal');
    const originalUrls = Object.freeze({ songs: 'https://lionliontomato.github.io/N9/', money: 'https://lionliontomato.github.io/N21/' });

    function switchPage(name) {
      const selectedPage = pages[name];
      if (!selectedPage) return;

      // 第二個頁面在第一次切換時才載入，避免初次開啟同時重複讀取兩份資料。
      if (!selectedPage.hasAttribute('src') && selectedPage.dataset.src) {
        selectedPage.src = selectedPage.dataset.src;
      }

      Object.entries(pages).forEach(([key, frame]) => {
        const active = key === name;
        frame.classList.toggle('is-active', active);
        frame.setAttribute('aria-hidden', String(!active));
      });
      tabs.forEach(tab => {
        const active = tab.dataset.page === name;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      document.title = name === 'songs' ? 'Neniの歌單｜Neniの小天地' : 'Neniの存鑽存歌｜Neniの小天地';
      originalLink.href = originalUrls[name];
      originalLink.setAttribute('aria-label', '在原網站開啟' + (name === 'songs' ? ' Neniの歌單' : ' Neniの存鑽存歌'));
      // 整合入口固定使用白色雛菊 favicon；子網站本身需分別修改才能改變其獨立圖示。
    }

    tabs.forEach(tab => tab.addEventListener('click', () => switchPage(tab.dataset.page)));
    tabs.forEach((tab, index) => tab.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      const next = tabs[(index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      next.focus();
      switchPage(next.dataset.page);
    }));
  })();
</script>
</body>
</html>
